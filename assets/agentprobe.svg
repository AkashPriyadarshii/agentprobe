<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-label="agentprobe logo">
  <!-- Magnifying glass body: circle lens -->
  <circle cx="38" cy="38" r="22" stroke="currentColor" stroke-width="6" fill="none"/>

  <!-- Handle -->
  <line x1="54" y1="54" x2="76" y2="76" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>

  <!-- Robot face inside lens: two eyes (small circles) -->
  <circle cx="31" cy="36" r="3.5" fill="currentColor"/>
  <circle cx="45" cy="36" r="3.5" fill="currentColor"/>

  <!-- Robot mouth: a short horizontal bar -->
  <rect x="30" y="43" width="16" height="3" rx="1.5" fill="currentColor"/>

  <!-- Antenna: vertical line + dot on top of the robot head -->
  <line x1="38" y1="21" x2="38" y2="16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="38" cy="13.5" r="2.5" fill="currentColor"/>

  <!-- Small circuit probe dots on handle — three evenly-spaced ticks -->
  <circle cx="61" cy="61" r="2" fill="currentColor" opacity="0.5"/>
  <circle cx="67" cy="67" r="2" fill="currentColor" opacity="0.5"/>
  <circle cx="73" cy="73" r="2" fill="currentColor" opacity="0.35"/>
</svg>
